services:
  - type: web
    name: pet-pricer
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run serve
    healthCheckPath: /api/sync-status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STARPETS_HOST
        value: 0.0.0.0
      - key: STARPETS_PORT
        value: 10000
      - key: AUTO_START_WATCH
        value: "true"
      - key: STARPETS_DB
        value: ./data/starpets.sqlite
      - key: STARPETS_REQUEST_BUDGET
        value: "35"
      - key: STARPETS_INTERVAL_MS
        value: "300000"
